[project]
name = "pantrychef"
version = "0.0.0"
description = "No-LLM multimodal cooking assistant: ingredient substitution, recipe recommendation, nutrition."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "PantryChef contributors" }]
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pandas>=2.2",
]

[project.optional-dependencies]
# Installed per-phase to keep the base env light on free notebooks.
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pre-commit>=3.7",
]
# Phase 2 flagship (CPU-only). Installed on demand to keep base env light.
substitution = [
    "gensim>=4.3.0",
    "scipy>=1.11",
    "numpy>=1.26",
    "mlflow>=2.9",
]
# Phase 3 reranker. Installed on demand to keep the base env light.
recommend = ["lightgbm>=4.0"]

[project.scripts]
pantrychef = "pantrychef.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pantrychef"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.coverage.run]
source = ["pantrychef"]
