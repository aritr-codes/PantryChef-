name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    # Runs the exact README quickstart on both supported platforms.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync deps
        # Tests import scipy, gensim and lightgbm at module level, so all extras are needed.
        run: uv sync --all-extras

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest --cov --cov-report=term-missing

      - name: CLI starts
        run: uv run pantrychef --help

  audit:
    # Reviewed exceptions, if any, go here as --ignore-vuln flags with a reason in docs/SECURITY_AUDIT.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Audit locked dependencies
        run: |
          uv export --all-extras --no-hashes --no-emit-project -o audit-requirements.txt
          uvx pip-audit -r audit-requirements.txt --no-deps --disable-pip
