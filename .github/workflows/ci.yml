name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync deps
        # Tests cover the Phase-2 substitution arms and the Phase-3 LambdaMART
        # reranker, so CI needs both optional extras (substitution =
        # scipy/gensim/numpy/mlflow; recommend = lightgbm/scikit-learn), not
        # just dev. Without `recommend`, the lambdamart leaderboard smoke test
        # importorskips and the flagship reranker arm gets no CI coverage.
        run: uv sync --extra dev --extra substitution --extra recommend

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest --cov --cov-report=term-missing

  # Phase 2+: an eval-gate job runs the evaluation harness and fails the build
  # on metric regression vs the recorded baseline in docs/EVALUATION.md.
